name: Update Market Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch market data
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import time

          key = os.environ["ALPHA_VANTAGE_API_KEY"]

          symbols = [
              "NVDA",
              "GOOGL",
              "AAPL",
              "MSFT",
              "AMZN",
              "TSLA"
          ]

          data = {}

          for symbol in symbols:

              print(f"Fetching {symbol}...")

              url = (
                  "https://www.alphavantage.co/query?"
                  + urllib.parse.urlencode({
                      "function": "TIME_SERIES_DAILY",
                      "symbol": symbol,
                      "outputsize": "compact",
                      "apikey": key
                  })
              )

              with urllib.request.urlopen(url) as response:
                  result = json.load(response)

              time_series = result.get("Time Series (Daily)", {})

              if not time_series:
                  print(f"No historical data returned for {symbol}")
                  print(result)
                  data[symbol] = {
                      "price": "—",
                      "change_percent": "—",
                      "history": []
                  }
                  continue

              dates = sorted(
                  time_series.keys(),
                  reverse=True
              )

              history = []

              for date in dates[:30]:

                  values = time_series[date]

                  history.append({
                      "date": date,
                      "open": values.get("1. open"),
                      "high": values.get("2. high"),
                      "low": values.get("3. low"),
                      "close": values.get("4. close"),
                      "volume": values.get("5. volume")
                  })

              latest_close = float(
                  history[0]["close"]
              )

              previous_close = float(
                  history[1]["close"]
              )

              change_percent = (
                  (latest_close - previous_close)
                  / previous_close
              ) * 100

              data[symbol] = {
                  "price": f"{latest_close:.4f}",
                  "change_percent": f"{change_percent:+.2f}%",
                  "history": history
              }

              time.sleep(2)

          with open("data.json", "w") as file:
              json.dump(data, file, indent=2)

          print("Market data successfully updated.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update market data"

          git push
